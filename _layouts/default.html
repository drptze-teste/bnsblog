<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.title }} · Benesse Gestão Esportiva</title>
<meta name="description" content="{{ page.description | default: site.description }}" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --blue:#4A90B5;
    --blue-dark:#2E5A7F;
    --orange:#FF9500;
    --orange-dark:#E68400;
    --green:#2ECC71;
    --ink:#333333;
    --ink-soft:#666666;
    --cream:#F5F5F5;
    --cream-2:#EEEEEE;
    --white:#FFFFFF;
    --line:rgba(51,51,51,.1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Hanken Grotesk',sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:500;line-height:1.1;letter-spacing:-.01em}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}

  /* TOPBAR */
  .topbar{
    background:var(--blue);
    border-bottom:1px solid rgba(255,255,255,.08);
    padding:12px 0;
  }
  .topbar-inner{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand-logo{
    display:flex;align-items:center;gap:12px;text-decoration:none;
  }
  .brand-logo-text{
    display:flex;flex-direction:column;line-height:1.2;
  }
  .brand-logo-text strong{
    font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:#fff;
  }
  .brand-logo-text span{
    font-size:12px;color:rgba(255,255,255,.6);font-weight:500;
  }
  .nav-links{display:flex;gap:24px;font-size:14px;font-weight:600;color:rgba(255,255,255,.7)}
  .nav-links a:hover{color:var(--orange)}
  .nav-links a.active{color:var(--orange)}

  @media(max-width:480px){
    .brand-logo-text strong{font-size:14px}
    .brand-logo-text span{display:none}
  }

  /* FOOTER */
  .site-footer{
    margin-top:80px;
    padding:40px 0;
    border-top:1px solid var(--line);
    background:var(--blue);
    color:rgba(255,255,255,.7);
  }
  .site-footer-inner{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    text-align:center;
  }
  .site-footer p{font-size:13px;line-height:1.6}
  .site-footer a{color:var(--gold);text-decoration:underline}
  .footer-brand{
    font-family:'Fraunces',serif;font-size:20px;color:#fff;font-weight:500;
  }
</style>
</head>
<body>

<nav class="topbar">
  <div class="wrap topbar-inner">
    <a href="{{ site.baseurl }}/" class="brand-logo">
      <img src="{{ site.baseurl }}/images/logo-benesse.png" alt="Benesse Gestão Esportiva" style="height:50px;width:auto" />
      <div class="brand-logo-text">
        <strong>Benesse Gestão Esportiva</strong>
        <span>Eventos · Bem-estar · Qualidade de Vida</span>
      </div>
    </a>
    <div class="nav-links">
      <a href="https://www.benessegestaoesportiva.com.br" target="_blank" rel="noopener">Site Principal</a>
      <a href="{{ site.baseurl }}/blog/" class="{% if page.layout == 'post' or page.url contains '/blog' %}active{% endif %}">Blog</a>
    </div>
  </div>
</nav>

{{ content }}

<footer class="site-footer">
  <div class="wrap site-footer-inner">
    <img src="{{ site.baseurl }}/images/logo-benesse.png" alt="Benesse Gestão Esportiva" style="height:56px;width:auto;opacity:.9" />
    <p>Eventos corporativos · Quick massagem · NR-1 · Gestão de Spa e Academias<br>
    São Paulo, SP · <a href="https://www.benessegestaoesportiva.com.br" target="_blank" rel="noopener">benessegestaoesportiva.com.br</a></p>
    <p>© {{ 'now' | date: "%Y" }} Benesse Gestão Esportiva</p>
  </div>
</footer>

</body>
</html>
