name: Post Automático Semanal

on:
  schedule:
    - cron: '0 18 * * 1'   # toda segunda-feira às 15h de Brasília (18h UTC)
  workflow_dispatch:         # permite rodar manualmente pelo GitHub

permissions:
  contents: write

jobs:
  gerar-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install @google/generative-ai google-trends-api
        working-directory: .github/scripts

      - name: Gerar post com Gemini + Google Trends
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/gerar-post.js

      - name: Commit e push do post
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$NOME_ARQUIVO"
          git commit -m "[bot] Post automático - semana $SEMANA — $TEMA"
          git push

      - name: Aguardar o post ficar no ar (GitHub Pages)
        if: success()
        run: |
          echo "Aguardando publicacao de $POST_URL ..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -m 15 -L -w "%{http_code}" "$POST_URL" || echo 000)
            if [ "$code" = "200" ]; then echo "Publicado (200) na tentativa $i."; exit 0; fi
            echo "[$i] ainda nao ($code) - aguardando 20s"; sleep 20
          done
          echo "Timeout aguardando publicacao - seguindo mesmo assim."

      - name: Avisar no WhatsApp (CallMeBot)
        if: success()
        env:
          PHONE:  ${{ secrets.WHATSAPP_PHONE }}
          APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          if [ -z "$PHONE" ] || [ -z "$APIKEY" ]; then
            echo "WHATSAPP_PHONE ou CALLMEBOT_APIKEY não configurados — pulando aviso."
            exit 0
          fi
          MENSAGEM="✅ Novo post no Blog Benesse: $TITULO — $POST_URL"
          curl -s -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=$PHONE" \
            --data-urlencode "text=$MENSAGEM" \
            --data-urlencode "apikey=$APIKEY"
          echo "Aviso de WhatsApp enviado."
